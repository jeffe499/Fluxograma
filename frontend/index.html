<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EstudaFácil — Protótipo</title>
<style>
  :root{ --bg:#0f1724; --card:#0b1220; --accent1:#7c5cff; --accent2:#00d1b2; --glass: rgba(255,255,255,0.04); font-family: Inter, system-ui, sans-serif; }
  *{box-sizing:border-box}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background: radial-gradient(1000px 400px at 10% 10%, rgba(124,92,255,0.12), transparent), linear-gradient(180deg,#07101a,#031022); color:#e6eef8; padding:24px; }
  .app{ width:100%; max-width:980px; display:grid; gap:18px; grid-template-columns:1fr 360px; }
  .header{ grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:12px }
  h1{ margin:0; font-size:20px; letter-spacing:-0.3px}
  .card{ background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px; padding:16px; box-shadow: 0 6px 20px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03)}
  .main { padding:12px; }
  .form{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .form input, .form select{ padding:10px 12px; border-radius:10px; border:none; background:var(--glass); color:inherit; min-width:120px }
  .btn{ background:linear-gradient(90deg,var(--accent1),var(--accent2)); padding:10px 14px; border-radius:10px; border:none; color:#042031; font-weight:600; cursor:pointer }
  .tasks{ margin-top:12px; display:grid; gap:10px }
  .task{ display:flex; justify-content:space-between; gap:10px; align-items:center; padding:12px; border-radius:10px; background:rgba(0,0,0,0.15) }
  .task .left{ display:flex; gap:12px; align-items:center }
  .dot{ width:12px; height:12px; border-radius:6px; flex-shrink:0 }
  .small{ font-size:12px; opacity:0.8 }
  .sidebar .section{ margin-bottom:12px }
  .muted{ opacity:0.7; font-size:13px }
  footer{ grid-column:1/-1; text-align:center; font-size:13px; opacity:0.7; margin-top:6px }
  @media(max-width:880px){ .app{ grid-template-columns:1fr; } .header{ flex-direction:column; align-items:flex-start } }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1>EstudaFácil</h1>
        <div class="small muted">Planner de estudos — protótipo (conectado ao backend seguro)</div>
      </div>
      <div style="display:flex; gap:8px; align-items:center">
        <div class="muted small">Backend: <span id="backendStatus" class="small muted">checando...</span></div>
        <button id="btnReload" class="btn">Recarregar dados</button>
      </div>
    </div>

    <div class="card main">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div><strong>Adicionar tarefa</strong><div class="small muted">Organize seu estudo</div></div>
      </div>

      <form id="taskForm" class="form" onsubmit="return false;">
        <input id="title" placeholder="Título (ex: Álgebra)" required />
        <select id="subject"></select>
        <input id="date" type="date" />
        <input id="time" type="time" />
        <input id="duration" type="number" placeholder="min" style="width:80px" />
        <button id="addBtn" class="btn">Adicionar</button>
      </form>

      <div class="tasks card" id="tasksContainer" style="margin-top:12px"></div>
    </div>

    <aside class="card sidebar">
      <div class="section">
        <strong>Agenda rápida</strong>
        <div class="small muted">Tarefas próximas</div>
      </div>
      <div id="nextList"></div>

      <hr style="opacity:0.06;margin:12px 0" />
      <div class="section">
        <strong>Preferências</strong>
        <div style="display:flex;gap:8px;margin-top:8px">
          <label class="small"><input id="notif" type="checkbox" /> Notificações</label>
          <label class="small">Sessão: <input id="sessionMin" type="number" value="50" style="width:56px;margin-left:6px" /></label>
        </div>
      </div>
    </aside>

    <footer class="muted">Protótipo | Backend proxy seguro • Não compartilhe chaves privadas</footer>
  </div>

<script>
const API_BASE = ''; // se hospedado mesmo domínio, deixa ''. Se o backend estiver em outro host: ex 'https://meu-backend.com'
const ENDPOINT = (path) => (API_BASE ? API_BASE + path : path);

/* === Estrutura padrão local (caixa de fallback) === */
const defaultData = {
  meta:{name:'EstudaFácil',version:'1.0',createdAt:new Date().toISOString()},
  users:[{id:'u1',name:'Você',timezone:'America/Sao_Paulo'}],
  subjects:[{id:'s1',name:'Matemática',color:'#7c5cff'},{id:'s2',name:'Português',color:'#00d1b2'}],
  tasks:[],
  settings:{notifications:true,studySessionMinutes:50}
};

let DATA = JSON.parse(JSON.stringify(defaultData));
const subjectEl = document.getElementById('subject');
const tasksContainer = document.getElementById('tasksContainer');
const nextList = document.getElementById('nextList');
const backendStatus = document.getElementById('backendStatus');

function uid(prefix='id') { return prefix + Math.random().toString(36).slice(2,9); }

function renderSubjects(){
  subjectEl.innerHTML = '';
  DATA.subjects.forEach(s=>{
    const opt = document.createElement('option'); opt.value = s.id; opt.textContent = s.name;
    subjectEl.appendChild(opt);
  });
}

function renderTasks(){
  tasksContainer.innerHTML = '';
  const sorted = DATA.tasks.slice().sort((a,b)=> (a.date||'') + (a.time||'') > (b.date||'')+(b.time||'') ? 1:-1);
  sorted.forEach(t=>{
    const el = document.createElement('div'); el.className='task';
    const sub = DATA.subjects.find(s=>s.id===t.subjectId) || {name:'Geral', color:'#888'};
    el.innerHTML = `
      <div class="left">
        <div class="dot" style="background:${sub.color}"></div>
        <div>
          <div><strong>${t.title}</strong></div>
          <div class="small muted">${sub.name} • ${t.date || ''} ${t.time || ''}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="small" onclick="toggleDone('${t.id}')">${t.done? '✔' : 'Marcar'}</button>
        <button class="small" onclick="removeTask('${t.id}')">Excluir</button>
      </div>
    `;
    tasksContainer.appendChild(el);
  });

  const upcoming = sorted.filter(t=>!t.done).slice(0,4);
  nextList.innerHTML = upcoming.map(t=>`<div class="small muted">${t.date||''} ${t.time||''} — ${t.title}</div>`).join('');
}

function addTaskFromForm(){
  const title = document.getElementById('title').value.trim();
  const subjectId = document.getElementById('subject').value;
  const date = document.getElementById('date').value;
  const time = document.getElementById('time').value;
  const durationMin = Number(document.getElementById('duration').value) || 30;
  if(!title) return alert('Coloque um título');
  const t = { id: uid('t'), title, subjectId, date, time, durationMin, done:false, notes:'' };
  DATA.tasks.push(t);
  saveData().then(()=>{ renderTasks(); clearForm(); });
}

function clearForm(){ document.getElementById('title').value=''; document.getElementById('duration').value=''; }

function toggleDone(id){
  const t = DATA.tasks.find(x=>x.id===id); if(!t) return;
  t.done = !t.done;
  saveData().then(renderTasks);
}
function removeTask(id){
  DATA.tasks = DATA.tasks.filter(x=>x.id!==id);
  saveData().then(renderTasks);
}

/* === Persistence via backend === */
async function fetchRemote(){
  try {
    const res = await fetch(ENDPOINT('/api/bin'));
    if(!res.ok) throw new Error('Falha ao conectar backend');
    const payload = await res.json();
    if(payload && payload.record) {
      DATA = payload.record;
      localStorage.setItem('estudafacil', JSON.stringify(DATA));
      backendStatus.textContent = 'Conectado';
      return true;
    }
    return false;
  } catch (err) {
    console.warn(err);
    backendStatus.textContent = 'Offline (usando localStorage)';
    return false;
  }
}

async function putRemote(){
  try {
    const res = await fetch(ENDPOINT('/api/bin'), {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(DATA)
    });
    if(!res.ok) throw new Error('Falha ao salvar no backend');
    const payload = await res.json();
    return payload.ok;
  } catch (err) {
    console.warn(err);
    return false;
  }
}

async function saveData(){
  localStorage.setItem('estudafacil', JSON.stringify(DATA));
  const ok = await putRemote();
  if(!ok) console.warn('Não foi possível salvar remote — salvo localmente');
}

/* init */
async function init(){
  // carregar local
  const local = localStorage.getItem('estudafacil');
  if(local) { DATA = JSON.parse(local); }
  renderSubjects(); renderTasks();

  const ok = await fetchRemote();
  if(ok) {
    renderSubjects(); renderTasks();
  }
}

document.getElementById('addBtn').addEventListener('click', addTaskFromForm);
document.getElementById('btnReload').addEventListener('click', async ()=>{ backendStatus.textContent = 'checando...'; await fetchRemote(); renderTasks(); });

document.getElementById('notif').addEventListener('change', (e)=>{ DATA.settings.notifications = e.target.checked; saveData(); });
document.getElementById('sessionMin').addEventListener('change', (e)=>{ DATA.settings.studySessionMinutes = Number(e.target.value); saveData(); });

init();
</script>
</body>
</html>
